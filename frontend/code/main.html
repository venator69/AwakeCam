    <section class="dashboard bg-light position-sticky top-0 w-100" style="z-index: 1030;">
        <div class="container">
            <div class="row bs5-grid-row">
                <div class="col-lg-1 col-md-3 col-sm-2 col-2" id="logo" onclick="location.href='intro.html'"><img src="raspberry-pi-logo.png" alt="Description of image" width="25" height="25"></div>

            </div>
        </div>
    </section>
    <section class="main page">

        <h5 align ="center">Sleep Detected : </h5>
        <div class="container text-center my-3">
            <div class="rounded-pill bg-success text-white fw-bold d-inline-block px-4 py-2" style="font-size: 1.25rem;">
                NO
            </div>
        </div>
        <h5 align ="center">Real Time Monitoring : </h5>
        <video src="dummy.mp4" controls width="400px" height="300px"></video>

    <div id="map" align = "center"></div>
    <p id="location-info"></p>
    <h6>Not implemented as implementing api costs real money</h6>
    </section>

    <script async defer
        src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap">
    </script>
